const W=720,H=500,g=document.getElementById('g'),ctx=g.getContext('2d');
const TW=128,TH=64,N=16, DS=64,DN=8;
let camX=0,camY=0,t=0;
const sheet=new Image(), dec=new Image();
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;});
function hsh(c,r){return(((c*73856093)^(r*19349663))>>>0);}

const enemies=[],shots=[];
function spawn(){const a=Math.random()*6.28,d=460;
  enemies.push({x:camX+Math.cos(a)*d,y:camY+Math.sin(a)*d,hp:3,
    col:['#f2839a','#8fd6b0','#f4b45c'][Math.random()*3|0]});}
function nearest(){let b=null,bd=1e9;for(const e of enemies){
  const dx=e.x-camX,dy=e.y-camY,d=dx*dx+dy*dy;if(d<bd){bd=d;b=e;}}return b;}

function isoFloor(){
  const ox=W/2-camX, oy=H/2-camY;
  const cc=(camX/(TW/2)+camY/(TH/2))/2, rr=(camY/(TH/2)-camX/(TW/2))/2;
  const R=13;
  for(let r=Math.floor(rr-R);r<=rr+R;r++){
    for(let c=Math.floor(cc-R);c<=cc+R;c++){
      const sx=ox+(c-r)*(TW/2)-TW/2, sy=oy+(c+r)*(TH/2)-TH/2;
      if(sx<-TW||sx>W||sy<-TH||sy>H)continue;
      const hv=hsh(c,r), k=hv%N;
      if((hv>>8)&1){ ctx.save(); ctx.translate(sx+TW,sy); ctx.scale(-1,1);
        ctx.drawImage(sheet,k*TW,0,TW,TH,0,0,TW,TH); ctx.restore(); }
      else ctx.drawImage(sheet,k*TW,0,TW,TH,sx,sy,TW,TH);
      // sparse decal layer on top
      if(hv%5===0 && dec.complete && dec.naturalWidth){
        const dk=(hv>>12)%DN; ctx.drawImage(dec,dk*DS,0,DS,DS,sx+32,sy,DS,DS);
      }
    }
  }
}

function loop(){
  t++; const sp=3.4;
  if(keys['w']||keys['arrowup'])camY-=sp;
  if(keys['s']||keys['arrowdown'])camY+=sp;
  if(keys['a']||keys['arrowleft'])camX-=sp;
  if(keys['d']||keys['arrowright'])camX+=sp;

  ctx.fillStyle='#0b0e13'; ctx.fillRect(0,0,W,H);
  if(sheet.complete&&sheet.naturalWidth) isoFloor();

  // ---- 위/아래 깊이 어두움 (약하게) ----
  let gt=ctx.createLinearGradient(0,0,0,150);
  gt.addColorStop(0,'rgba(6,8,12,0.55)'); gt.addColorStop(1,'rgba(6,8,12,0)');
  ctx.fillStyle=gt; ctx.fillRect(0,0,W,150);
  let gb=ctx.createLinearGradient(0,H,0,H-150);
  gb.addColorStop(0,'rgba(6,8,12,0.55)'); gb.addColorStop(1,'rgba(6,8,12,0)');
  ctx.fillStyle=gb; ctx.fillRect(0,H-150,W,150);

  if(t%22===0&&enemies.length<40)spawn();
  for(const e of enemies){const dx=camX-e.x,dy=camY-e.y,d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*1.1; e.y+=dy/d*1.1;}
  if(t%14===0){const tg=nearest();if(tg){const dx=tg.x-camX,dy=tg.y-camY,d=Math.hypot(dx,dy)||1;
    shots.push({x:camX,y:camY,vx:dx/d*7,vy:dy/d*7,life:80});}}
  for(const s of shots){s.x+=s.vx;s.y+=s.vy;s.life--;
    for(const e of enemies){if(Math.abs(e.x-s.x)<16&&Math.abs(e.y-s.y)<16){e.hp--;s.life=0;}}}
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].hp<=0)enemies.splice(i,1);
  for(let i=shots.length-1;i>=0;i--)if(shots[i].life<=0)shots.splice(i,1);

  for(const e of enemies){const x=e.x-camX+W/2,y=e.y-camY+H/2;
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(x-11,y-4,26,26);
    ctx.fillStyle=e.col;ctx.fillRect(x-13,y-13,26,26);}
  ctx.strokeStyle='#7fe9ff';ctx.lineWidth=3;
  for(const s of shots){const x=s.x-camX+W/2,y=s.y-camY+H/2;
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-s.vx*1.4,y-s.vy*1.4);ctx.stroke();}
  ctx.save();ctx.shadowBlur=14;ctx.shadowColor='#bfe4ff';
  ctx.fillStyle='rgba(0,0,0,.45)';ctx.beginPath();ctx.ellipse(W/2,H/2+12,13,5,0,0,6.28);ctx.fill();
  ctx.fillStyle='#8fd0ff';ctx.beginPath();ctx.arc(W/2,H/2,12,0,6.28);ctx.fill();
  ctx.fillStyle='#eaf6ff';ctx.beginPath();ctx.arc(W/2-4,H/2-4,4,0,6.28);ctx.fill();
  ctx.restore();
  const v=ctx.createRadialGradient(W/2,H/2,150,W/2,H/2,W*0.62);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(5,7,11,0.5)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#9fb';ctx.font='13px system-ui';
  ctx.fillText('적 '+enemies.length+' · 발사체 '+shots.length,12,H-12);
  requestAnimationFrame(loop);
}
let ld=0; const go=()=>{if(++ld>=1)loop();};
sheet.onload=go; sheet.onerror=go; sheet.src=STONE_SRC;
dec.onload=()=>{}; dec.onerror=()=>{}; dec.src=DECAL_SRC;
</script></body></html>
